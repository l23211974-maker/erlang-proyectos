<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cowboy Demo</title>
<style>
  :root {
    --navy: #0b1f3a; --red: #a90533; --ink: #1b2733; --muted: #5b6b7b;
    --soft: #eef2f6; --line: #cbd5e0; --ok: #1f7a5a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: #fff; }
  header { background: var(--navy); color: #fff; padding: 18px 16px; border-left: 8px solid var(--red); }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; color: #c9d6e6; font-size: .9rem; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: var(--soft); border-radius: 8px; padding: 14px; }
  .card small { color: var(--muted); display: block; }
  .card strong { font-size: 2.2rem; }
  .modes { display: flex; gap: 8px; margin: 16px 0 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 8px 14px; border: 1px solid var(--line); background: #fff;
           border-radius: 6px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  #status { margin-left: auto; font-size: .9rem; color: var(--muted); }
  #status.on { color: var(--ok); }
  canvas { width: 100%; height: 160px; background: var(--soft); border-radius: 8px; display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: .9rem; }
  th { color: var(--muted); font-weight: 600; }
  footer { color: var(--muted); font-size: .8rem; padding: 12px 16px 24px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Cowboy Demo: sensor simulado</h1>
  <p>Un proceso Erlang genera lecturas; Cowboy las empuja al navegador.</p>
</header>
<main>
  <div class="cards">
    <div class="card"><small>Temperatura</small><strong id="temp">--</strong> &deg;C</div>
    <div class="card"><small>Humedad</small><strong id="hum">--</strong> %</div>
  </div>

  <div class="modes" role="group" aria-label="Transporte">
    <button id="m-sse" aria-pressed="true">SSE</button>
    <button id="m-ws" aria-pressed="false">WebSocket</button>
    <span id="status">desconectado</span>
  </div>

  <canvas id="chart" width="720" height="160"></canvas>

  <table>
    <thead><tr><th>Hora</th><th>Temp</th><th>Hum</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<footer>GET /api/readings &middot; GET /api/health &middot; /sse &middot; /ws</footer>

<script>
"use strict";
const MAX = 60;
const data = [];
const $ = (id) => document.getElementById(id);
let conn = null;

function push(r) {
  data.push(r);
  if (data.length > MAX) data.shift();
  $("temp").textContent = r.temp.toFixed(1);
  $("hum").textContent = r.hum.toFixed(1);
  render();
}

function render() {
  const tbody = $("rows");
  tbody.replaceChildren(...data.slice(-8).reverse().map((r) => {
    const tr = document.createElement("tr");
    for (const v of [new Date(r.ts).toLocaleTimeString(), r.temp.toFixed(1), r.hum.toFixed(1)]) {
      const td = document.createElement("td");
      td.textContent = v;
      tr.appendChild(td);
    }
    return tr;
  }));
  draw();
}

function draw() {
  const cv = $("chart"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (data.length < 2) return;
  const temps = data.map((r) => r.temp);
  const lo = Math.min(...temps) - 0.5, hi = Math.max(...temps) + 0.5;
  ctx.strokeStyle = "#a90533";
  ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((r, i) => {
    const x = (i / (MAX - 1)) * cv.width;
    const y = cv.height - ((r.temp - lo) / (hi - lo)) * (cv.height - 20) - 10;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
}

function setStatus(text, on) {
  const s = $("status");
  s.textContent = text;
  s.classList.toggle("on", on);
}

function connect(mode) {
  if (conn) conn.close();
  $("m-sse").setAttribute("aria-pressed", mode === "sse");
  $("m-ws").setAttribute("aria-pressed", mode === "ws");
  setStatus("conectando...", false);
  if (mode === "sse") {
    conn = new EventSource("/sse");
    conn.onopen = () => setStatus("conectado por SSE", true);
    conn.onerror = () => setStatus("reconectando (SSE)...", false);
    conn.onmessage = (e) => push(JSON.parse(e.data));
  } else {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    conn = new WebSocket(`${proto}://${location.host}/ws`);
    conn.onopen = () => setStatus("conectado por WebSocket", true);
    conn.onclose = () => setStatus("WebSocket cerrado", false);
    conn.onmessage = (e) => push(JSON.parse(e.data));
  }
}

$("m-sse").onclick = () => connect("sse");
$("m-ws").onclick = () => connect("ws");

fetch("/api/readings").then((r) => r.json()).then((rows) => {
  rows.slice(-MAX).forEach((r) => data.push(r));
  if (data.length) push(data.pop());
  connect("sse");
});
</script>
</body>
</html>
