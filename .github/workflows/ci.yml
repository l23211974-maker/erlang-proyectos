name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [demos/cowboy_demo, demos/let_it_crash, demos/hot_upgrade, demos/plugin_sinks, proyectos/01-vinedos, proyectos/02-invernadero, proyectos/03-riego-por-zonas]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"
      - name: Compile
        working-directory: ${{ matrix.project }}
        run: rebar3 compile
      - name: Eunit
        working-directory: ${{ matrix.project }}
        run: rebar3 eunit
